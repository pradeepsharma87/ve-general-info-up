<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#172B68">
<title>VE सामान्य जानकारी – उत्तर प्रदेश</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--mid:#172B68;--slate:#1D3256;--bg2:#1E8481;--gold:#E7A740;--red:#7E1B1E;--pearl:#F2ECE0;--powder:#C3CDEB;--grey:#DCDCDC;--egrey:#B5B5AF;--txt:#1f2430}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--pearl);color:var(--txt);font-family:Lato,Aptos,Roboto,"Noto Sans Devanagari","Noto Sans",Arial,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.slab{font-family:"Roboto Slab","Noto Serif Devanagari",Georgia,serif}
header{background:var(--mid);color:#fff;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--gold)}
.hbar{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px}
.htitle{flex:1;min-width:0}
.htitle h1{font-size:17px;margin:0;line-height:1.25}
.htitle small{font-size:12px;color:var(--powder)}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:6px;padding:6px 9px;font-size:13px;font-weight:700}
.net{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 12px 8px;max-width:680px;margin:0 auto;color:var(--powder)}
.dot{width:9px;height:9px;border-radius:50%;background:#e05b5b;display:inline-block}
.dot.on{background:#5fd38d}
main{max-width:680px;margin:0 auto;padding:12px 12px 110px}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid var(--grey)}
.card h2{font-size:17px;color:var(--mid);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.num{background:var(--bg2);color:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;font-family:Lato,Arial,sans-serif;flex:none}
.fld{margin-bottom:14px;position:relative}
.fld:last-child{margin-bottom:0}
label.l{display:block;font-weight:700;font-size:15px;margin-bottom:5px;color:var(--slate)}
.req{color:var(--red)}
.hint{font-size:13px;color:#5d6270;margin-top:4px}
input[type=text],input[type=tel],input[type=number],input[type=url],select{width:100%;font-size:17px;padding:11px 10px;border:1.5px solid var(--egrey);border-radius:8px;background:#fff;color:var(--txt);font-family:inherit;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mid) 50%),linear-gradient(135deg,var(--mid) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus{outline:none;border-color:var(--mid);box-shadow:0 0 0 3px rgba(23,43,104,.15)}
input[readonly]{background:#f4f5f8;color:#333}
.bad input,.bad select{border-color:var(--red);background:#fff7f7}
.err{color:var(--red);font-size:13px;font-weight:700;margin-top:4px;display:none}
.bad .err{display:block}
.sug{border:1.5px solid var(--mid);border-radius:8px;margin-top:4px;max-height:300px;overflow-y:auto;background:#fff}
.sug div{padding:10px;border-bottom:1px solid var(--grey);font-size:15px}
.sug div:last-child{border-bottom:0}
.sug div:active{background:var(--powder)}
.sug b{color:var(--mid)}
.sug .meta{font-size:12px;color:#5d6270}
.sug .more{background:#f6f3ec;color:#5d6270;font-size:13px}
.picked{background:#eef1fa;border-left:4px solid var(--bg2);border-radius:6px;padding:10px;font-size:14px}
.picked b{color:var(--mid)}
.linkbtn{background:none;border:0;color:var(--bg2);font-weight:700;font-size:15px;text-decoration:underline;padding:6px 0;font-family:inherit}
.row3{display:flex;gap:8px}
.row3 .fld{flex:1;margin-bottom:0}
.row3 label.l{font-size:13px}
.cls{border:1.5px dashed var(--bg2);border-radius:8px;padding:10px;margin-top:10px;background:#f7fbfb}
.cls h3{margin:0 0 8px;font-size:15px;color:var(--bg2)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:90px;border:1.5px solid var(--egrey);border-radius:8px;padding:10px 6px;text-align:center;font-weight:700;font-size:15px;background:#fff}
.seg input{display:none}
.seg input:checked+span{color:#fff}
.seg label.sel{background:var(--mid);border-color:var(--mid);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:8px;padding:14px;font-size:17px;font-weight:700;font-family:inherit;margin-top:8px;color:#fff;background:var(--bg2)}
.btn.blue{background:var(--mid)}
.btn.gold{background:var(--gold);color:#1b1b1b}
.btn.ghost{background:#fff;color:var(--mid);border:1.5px solid var(--mid)}
.btn.red{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn:disabled{opacity:.5}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--grey);z-index:15;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.foot .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.foot .btn{margin:0}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:#fff;border:1px solid var(--grey);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;font-family:"Roboto Slab",Georgia,serif;color:var(--mid)}
.stat.q b{color:var(--red)}
.stat.s b{color:var(--bg2)}
.stat span{font-size:12px;color:#5d6270}
ol.ins{margin:0;padding-left:20px}
ol.ins li{margin-bottom:6px;font-size:15px}
.ent{border:1px solid var(--grey);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff}
.ent .t{font-weight:700;color:var(--mid);font-size:15px}
.ent .m{font-size:13px;color:#5d6270}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;margin-right:4px}
.chip.draft{background:#eee;color:#555}
.chip.queued{background:#fde9c7;color:#7a4b00}
.chip.sent{background:#d5efed;color:#11605d}
.chip.corr{background:var(--powder);color:var(--mid)}
.ent .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ent .acts button{flex:1;min-width:90px;font-size:14px;padding:8px;border-radius:6px;border:1.5px solid var(--mid);background:#fff;color:var(--mid);font-weight:700;font-family:inherit}
.ent .acts button.d{border-color:var(--red);color:var(--red)}
.filter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter button{border:1.5px solid var(--egrey);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;font-family:inherit;color:var(--slate)}
.filter button.on{background:var(--mid);color:#fff;border-color:var(--mid)}
.banner{background:#fff6e3;border:1px solid var(--gold);border-radius:8px;padding:10px;font-size:14px;margin-bottom:12px}
.banner.err2{background:#fff0f0;border-color:var(--red);color:var(--red)}
.tag{font-size:11px;background:var(--gold);color:#222;border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:15px;z-index:60;display:none;max-width:90%;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#fff;border-radius:12px;max-width:440px;width:100%;padding:16px;max-height:85vh;overflow:auto}
#modal h3{margin:0 0 8px;color:var(--mid)}
#modal .mb{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#modal .mb .btn{flex:1;min-width:120px}
#modal .mb .btn{margin:0}
.sum td{padding:4px 6px;border-bottom:1px solid var(--grey);font-size:14px;vertical-align:top}
.sum td:first-child{color:#5d6270;width:42%}
.hidden{display:none!important}
.ver{text-align:center;font-size:12px;color:#888;margin-top:16px}
@media (min-width:700px){.htitle h1{font-size:20px}main{padding-top:18px}}
</style>
</head>

function t(k,o){var s=(T[LANG][k]!==undefined?T[LANG][k]:k);if(o)for(var x in o)s=s.replace('{'+x+'}',o[x]);return s;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------------- storage (IndexedDB, shared with service worker) ---------------- */
var db=null, ENT={}, META={};
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('ve_geninfo',1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('entries'))d.createObjectStore('entries',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function tx(store,mode,fn){return new Promise(function(res,rej){var x=db.transaction(store,mode);var st=x.objectStore(store);var out=fn(st);x.oncomplete=function(){res(out&&out.result!==undefined?out.result:undefined);};x.onerror=function(){rej(x.error);};});}
function putE(e){ENT[e.id]=e;return tx('entries','readwrite',function(s){return s.put(e);});}
function delE(id){delete ENT[id];return tx('entries','readwrite',function(s){return s.delete(id);});}
function setM(k,v){META[k]=v;return tx('meta','readwrite',function(s){return s.put(v,k);});}
function loadAll(){return new Promise(function(res){var x=db.transaction(['entries','meta'],'readonly');var c=x.objectStore('entries').openCursor();c.onsuccess=function(){var cu=c.result;if(cu){ENT[cu.value.id]=cu.value;cu.continue();}};var m=x.objectStore('meta').openCursor();m.onsuccess=function(){var cu=m.result;if(cu){META[cu.key]=cu.value;cu.continue();}};x.oncomplete=res;x.onerror=res;});}

function uid(){return (Date.now().toString(36)+Math.random().toString(36).slice(2,8)).toUpperCase();}
function nowISO(){var d=new Date(),z=function(n){return (n<10?'0':'')+n;};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds());}
function scriptUrl(){return (META.scriptUrl||SCRIPT_URL||'').trim();}

var toastT;

function modal(html,btns){return new Promise(function(res){var b=$('mbox');b.innerHTML=html+'<div class="mb">'+btns.map(function(x,i){return '<button class="btn '+(x.cls||'')+'" data-i="'+i+'">'+esc(x.t)+'</button>';}).join('')+'</div>';$('modal').style.display='flex';b.querySelectorAll('.mb button').forEach(function(bt){bt.onclick=function(){$('modal').style.display='none';res(btns[+bt.getAttribute('data-i')].v);};});});}
function confirmBox(msg){return modal('<p style="font-size:16px">'+esc(msg)+'</p>',[{t:t('no'),cls:'ghost',v:false},{t:t('yes'),v:true}]);}

function counts(){var c={draft:0,queued:0,sent:0};for(var k in ENT)c[ENT[k].status]=(c[ENT[k].status]||0)+1;return c;}
function netUI(){var on=navigator.onLine;$('netDot').className='dot'+(on?' on':'');$('netTxt').textContent=on?t('online'):t('offline');var q=counts().queued;$('pendTxt').textContent=q?t('pending')+q:'';}

  SCREEN='home';var c=counts();
  var h='';

  if(!scriptUrl())h+='<div class="banner err2">'+esc(t('noUrl'))+'</div>';
  var old=0,lim=Date.now()-3*86400000;for(var k in ENT){var e0=ENT[k];if(e0.status==='queued'&&e0.submittedAt&&new Date(e0.submittedAt.replace(' ','T')).getTime()<lim)old++;}
  if(old)h+='<div class="banner err2">⚠ '+esc(t('oldQ',{n:old}))+'</div>';
  h+='<div class="stats"><div class="stat"><b>'+(c.draft||0)+'</b><span>'+t('stDraft')+'</span></div><div class="stat q"><b>'+(c.queued||0)+'</b><span>'+t('stQueued')+'</span></div><div class="stat s"><b>'+(c.sent||0)+'</b><span>'+t('stSent')+'</span></div></div>';

  h+='<div class="hint">'+esc(t('lastSync'))+esc(META.lastSync||t('never'))+'</div></div>';
  h+='<button class="btn gold" id="bakBtn">'+esc(t('backup'))+'</button><button class="btn ghost" id="setBtn">'+esc(t('settings'))+'</button><div class="ver">'+esc(t('version'))+' '+APP_VERSION+'</div>';
  $('main').innerHTML=h;

  window.scrollTo(0,0);netUI();
}
function stLabel(s){return s==='draft'?t('stDraft'):s==='queued'?t('stQueued'):t('stSent');}
function renderList(){
  var arr=[];for(var k in ENT)if(FILTER==='all'||ENT[k].status===FILTER)arr.push(ENT[k]);
  arr.sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'');});
  var el=$('elist');if(!arr.length){el.innerHTML='<div class="hint">'+esc(t('empty'))+'</div>';return;}
  el.innerHTML=arr.map(function(e){var d=e.data;return '<div class="ent"><div><span class="chip '+e.status+'">'+esc(stLabel(e.status))+'</span>'+(e.editOf?'<span class="chip corr">'+esc(t('isCorr'))+'</span>':'')+'</div><div class="t">'+esc(d.school||'—')+'</div><div class="m">'+esc(d.udise||'')+(d.district?' • '+esc(d.district):'')+'</div><div class="m">'+esc(d.vtName||'')+(d.sector?' • '+esc(d.sector):'')+'</div><div class="m">'+esc(e.status==='sent'?(e.sentAt||''):(e.updatedAt||''))+'</div><div class="acts">'+
    (e.status==='draft'?'<button data-a="cont" data-id="'+e.id+'">'+esc(t('cont'))+'</button><button class="d" data-a="del" data-id="'+e.id+'">'+esc(t('del'))+'</button>':'<button data-a="view" data-id="'+e.id+'">'+esc(t('view'))+'</button>'+(e.status==='sent'?'<button data-a="corr" data-id="'+e.id+'">'+esc(t('corr'))+'</button>':''))+'</div></div>';}).join('');
  el.querySelectorAll('button').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-id'),a=b.getAttribute('data-a');
    if(a==='cont')openForm(ENT[id]);
    else if(a==='del')confirmBox(t('delQ')).then(function(y){if(y)delE(id).then(renderHome);});
    else if(a==='view')shareModal(ENT[id],'<h3>'+esc(t('view'))+'</h3>'+summary(ENT[id].data));

}

  if(!d.udise)E('udise',t('eReq'));else if(!BYU[d.udise])E('udise',d.udise.length<10?t('eUdiseLen'):t('eUdise'));
  if(!d.school||!BYU[d.udise])E('school',t('eSchool'));}
  if(!d.district)E('district',t('eReq'));
  if(!(d.block||'').trim())E('block',d.blockSel==='__other'?t('eName'):t('eReq'));
  if((d.vtName||'').replace(/[^A-Za-zऀ-ॿ]/g,'').length<3)E('vtName',t('eName'));

function drawPage(e){
  var W=1240,H=1754,cv=document.createElement('canvas');cv.width=W;cv.height=H;var c=cv.getContext('2d');

  c.fillStyle='#fff';c.font='bold 40px '+SL;var y=70;wrap(c,t('title'),W-120).forEach(function(l){c.fillText(l,60,y);y+=50;});

    c.fillStyle='#1D3256';c.font='26px '+FN;lab.forEach(function(l,k){c.fillText(l,L+16,y+40+k*38);});

  c.fillStyle='#E7A740';c.fillRect(0,H-30,W,30);

  var bin=atob(b64),img=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
  var parts=[],off=[],pos=0;
  function add(x){var u=typeof x==='string'?new TextEncoder().encode(x):x;parts.push(u);pos+=u.length;}
  function obj(n,body){off[n]=pos;add(n+' 0 obj\n'+body+'\nendobj\n');}
  add('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  off[4]=pos;add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n');add(img);add('\nendstream\nendobj\n');
  var cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';obj(5,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  var x=pos,xr='xref\n0 6\n0000000000 65535 f \n';for(var n=1;n<=5;n++)xr+=('000000000'+off[n]).slice(-10)+' 00000 n \n';
  add(xr+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function sharePdf(e){
  try{
    var cv=drawPage(e),b64=cv.toDataURL('image/jpeg',0.85).split(',')[1],blob=pdfFromJpeg(b64,cv.width,cv.height);
    var name='VE_'+(e.data.udise||'')+'_'+jrName(e.data).replace(/[^A-Za-z0-9]+/g,'_').slice(0,30)+'_'+e.id.slice(-5)+'.pdf';
    var file=null;try{file=new File([blob],name,{type:'application/pdf'});}catch(x){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});return;}
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);
  }catch(err){toast('PDF: '+err,4000);}
}

/* ---------------- backup: all entries on this phone as one CSV (opens in Excel) ---------------- */
function backup(){
  var arr=[];for(var k in ENT)arr.push(ENT[k]);
  if(!arr.length){toast(t('noBak'));return;}
  arr.sort(function(a,b){return (a.createdAt||'').localeCompare(b.createdAt||'');});
  var H=['Status','Submission_ID','Created_On_Phone','Submitted_On_Phone','Sent_At','UDISE_Code','School_Name','District','Block','VT_Name','VT_Phone','VT_Gender','VE_Sector','Job_Role','VTP_Name','Classes_Taught','Class10_Boys','Class10_Girls','Class12_Boys','Class12_Girls','Entry_Type','Corrects_Submission_ID','Device_ID'];
  function q(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
  var lines=[H.join(',')];
  arr.forEach(function(e){var d=e.data,c=d.classes||'';var st=e.status==='sent'?'Sent':e.status==='queued'?'Not sent':'Incomplete';
    lines.push([st,e.id,e.createdAt,e.submittedAt||'',e.sentAt||'',"'"+(d.udise||''),d.school,d.district,d.block,d.vtName,"'"+(d.vtPhone||''),d.vtGender,d.sector,jrName(d),vtpName(d),c,
      c.indexOf('10')>=0?d.c10b:'',c.indexOf('10')>=0?d.c10g:'',c.indexOf('12')>=0?d.c12b:'',c.indexOf('12')>=0?d.c12g:'',e.editOf?'Correction':'New',e.editOf||'',META.deviceId].map(q).join(','));});
  var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv'});
  var nm='VE_Backup_'+(META.deviceId||'')+'_'+nowISO().slice(0,10)+'.csv',file=null;
  try{file=new File([blob],nm,{type:'text/csv'});}catch(x){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:nm}).catch(function(){});return;}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);
}

/* ---------------- sending ---------------- */
function payload(e){var d=e.data,c=(d.classes||'').split(',');
  function n(x){return x===''||x==null?'':+x;}
  var has10=c.indexOf('10')>=0,has12=c.indexOf('12')>=0;
  var r={id:e.id,submittedAt:e.submittedAt,udise:d.udise,school:(d.school||'').trim().replace(/\s+/g,' '),district:d.district,block:(d.block||'').trim(),schoolNotInPreload:d.manualSchool?'Yes':'No',blockPreload:d.blockManual?'':((PRE.BR&&PRE.BR[d.udise])||d.block||''),blockManual:d.blockManual?(d.blockSel==='__other'?'Typed':'Dropdown'):'No',
    vtName:(d.vtName||'').trim().replace(/\s+/g,' '),vtPhone:d.vtPhone,vtGender:d.vtGender,sector:d.sector,jobRole:jrName(d),jobRoleNotInList:d.jobRole==='__other'?'Yes':'No',vtp:vtpName(d),vtpNotInList:d.vtp==='__other'?'Yes':'No',
    classes:has10&&has12?'10, 12':has10?'10':'12',
    c10b:has10?n(d.c10b):'',c10g:has10?n(d.c10g):'',c12b:has12?n(d.c12b):'',c12g:has12?n(d.c12g):'',
    entryType:e.editOf?'Correction':'New',editOf:e.editOf||'',changed:e.changed||'',deviceId:META.deviceId,appVersion:APP_VERSION,lang:LANG};
  return r;}
var syncing=false;
function syncAll(manual){
  if(syncing)return Promise.resolve(0);
  var q=[];for(var k in ENT)if(ENT[k].status==='queued')q.push(ENT[k]);
  if(!q.length){if(manual)toast(t('nothing'));return Promise.resolve(0);}
  if(!scriptUrl()){if(manual)toast(t('noUrl'),3500);return Promise.resolve(0);}
  if(!navigator.onLine){if(manual)toast(t('noNet'),3500);return Promise.resolve(0);}
  syncing=true;var sent=0,fail=0;
  q.sort(function(a,b){return (a.submittedAt||'').localeCompare(b.submittedAt||'');});
  var p=Promise.resolve();
  q.forEach(function(e){p=p.then(function(){return send(e).then(function(ok){if(ok)sent++;else fail++;});});});
  return p.then(function(){syncing=false;if(sent)setM('lastSync',nowISO());
    if(manual||sent){toast(sent?t('sentN',{n:sent}):t('sendFail'),3000);}
    if(SCREEN==='home')renderHome();else netUI();return sent;});
}
function send(e){
  var ctl=('AbortController' in window)?new AbortController():null;var tm=setTimeout(function(){if(ctl)ctl.abort();},45000);
  return fetch(scriptUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'submit',record:e.payload||payload(e)}),signal:ctl?ctl.signal:undefined,redirect:'follow'})
  .then(function(r){return r.json();}).then(function(j){clearTimeout(tm);
    if(j&&j.ok){var cur=ENT[e.id]||e;cur.status='sent';cur.sentAt=nowISO();return putE(cur).then(function(){return true;});}
    return false;}).catch(function(){clearTimeout(tm);return false;});
}
function refreshLists(manual){
  if(!scriptUrl()||!navigator.onLine){if(manual)toast(!scriptUrl()?t('noUrl'):t('noNet'));return;}
  fetch(scriptUrl()+'?action=lists').then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok){if(j.sectors&&j.sectors.length){SECTORS=j.sectors;setM('sectors',j.sectors);}if(j.vtps&&j.vtps.length){VTPS=j.vtps;setM('vtps',j.vtps);}if(j.jobRoles&&j.jobRoles.length&&typeof j.jobRoles[0]==='string'){JR=j.jobRoles;setM('jr',j.jobRoles);}if(manual)toast(t('listsOk'));}
  }).catch(function(){if(manual)toast(t('sendFail'));});
}
function regSync(){if('serviceWorker' in navigator&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(function(r){if(r.sync)r.sync.register('send-queue').catch(function(){});}).catch(function(){});}}

/* ---------------- start ---------------- */
$('langBtn').onclick=function(){LANG=LANG==='hi'?'en':'hi';setM('lang',LANG);setHeader();netUI();if(SCREEN==='form')renderForm();else if(SCREEN==='set')renderSettings();else renderHome();};
window.addEventListener('online',function(){netUI();syncAll(false);refreshLists(false);});
window.addEventListener('offline',netUI);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){reloadEntries().then(function(){netUI();syncAll(false);});}else saveDraft();});
window.addEventListener('pagehide',function(){saveDraft();});
document.addEventListener('click',function(ev){if(!ev.target.closest||!ev.target.closest('.sug, #udise, #school'))hideSug();});
function reloadEntries(){if(!db)return Promise.resolve();var keep=CUR;return new Promise(function(res){var x=db.transaction('entries','readonly');var c=x.objectStore('entries').openCursor();c.onsuccess=function(){var cu=c.result;if(cu){if(!keep||cu.value.id!==keep.id)ENT[cu.value.id]=cu.value;cu.continue();}};x.oncomplete=res;x.onerror=res;});}

idb().then(function(d){db=d;return loadAll();}).catch(function(){toast(T.hi.storeWarn,6000);}).then(function(){
  LANG=META.lang||'hi';
  if(!META.deviceId&&db)setM('deviceId','D-'+uid().slice(-8));
  if(META.sectors&&META.sectors.length)SECTORS=META.sectors;
  if(META.vtps&&META.vtps.length)VTPS=META.vtps;
  if(META.jr&&META.jr.length&&typeof META.jr[0]==='string')JR=META.jr;
  if(db)setM('scriptUrlDefault',SCRIPT_URL);
  setHeader();renderHome();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
  syncAll(false);refreshLists(false);
  setInterval(function(){if(navigator.onLine)syncAll(false);},60000);
});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    function watch(w){w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller){swWaiting=w;if(SCREEN==='home')renderHome();}});}
    if(reg.waiting&&navigator.serviceWorker.controller){swWaiting=reg.waiting;}
    reg.addEventListener('updatefound',function(){if(reg.installing)watch(reg.installing);});
    setInterval(function(){if(navigator.onLine)reg.update().catch(function(){});},3600000);
  }).catch(function(){});
  var reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloaded)return;reloaded=true;saveDraft().then(function(){location.reload();});});
  navigator.serviceWorker.addEventListener('message',function(ev){if(ev.data==='synced'){reloadEntries().then(function(){if(SCREEN==='home')renderHome();else netUI();});}});
}
})();
